# A local Kubernetes cluster in Docker for testing manifests before they go to
# the server: `mise run kind-deploy`, then `mise run kind-down`. The server
# setup (Tailscale, firewall, k3s) is tested on EC2 instead; see tf/test.
#
# The apps' NodePorts are published on localhost, e.g. http://localhost:30000.
# /srv/homelab volumes live inside the kind container and go with it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: homelab
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30000   # Homepage
        hostPort: 30000
        listenAddress: 127.0.0.1
      - containerPort: 30003   # Gatus
        hostPort: 30003
        listenAddress: 127.0.0.1
      - containerPort: 30008   # Hermes dashboard
        hostPort: 30008
        listenAddress: 127.0.0.1
      - containerPort: 30016   # Dozzle
        hostPort: 30016
        listenAddress: 127.0.0.1
