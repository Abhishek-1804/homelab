apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-agent-data
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: hermes-agent-pv
  resources:
    requests:
      storage: 256Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: ai
spec:
  replicas: 1
  # one Hermes at a time: two would share the data folder and the Discord bot
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      # Hermes has no business talking to the Kubernetes API; without this
      # it gets a token that could read the cluster.
      automountServiceAccountToken: false
      containers:
        - name: hermes-agent
          image: nousresearch/hermes-agent:latest
          # The image's own supervisor runs the gateway (args) and, with
          # HERMES_DASHBOARD=1, the dashboard; overriding `command` skips it.
          args: ["gateway", "run"]
          env:
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              value: abhishek
            # The rest come from 1Password: .env → the homelab-env Secret
            # (`mise run deploy`). Hermes gets only what's listed here, and a
            # missing one stops the pod from starting, naming the key.
            # Hermes-only settings (the Discord bot, allowed users, X, ...) are
            # set in its dashboard instead and kept in its data folder.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom: { secretKeyRef: { name: homelab-env, key: CLAUDE_CODE_OAUTH_TOKEN } }
            # GitHub token for Hermes's own backups: Contents read/write on
            # Abhishek-1804/hermes-backups only
            - name: HERMES_BACKUP_PAT
              valueFrom: { secretKeyRef: { name: homelab-env, key: HERMES_BACKUP_PAT } }
            # dashboard login password, and the key that signs its session cookies
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom: { secretKeyRef: { name: homelab-env, key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD } }
            - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
              valueFrom: { secretKeyRef: { name: homelab-env, key: HERMES_DASHBOARD_BASIC_AUTH_SECRET } }
          ports:
            - containerPort: 8642  # gateway / OpenAI-compatible API
            - containerPort: 9119  # web dashboard
            - containerPort: 3000  # web pages Hermes serves (tell it: 0.0.0.0, port 3000)
          volumeMounts:
            - name: data
              mountPath: /opt/data   # where the image keeps all Hermes state
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: ai
spec:
  selector:
    app: hermes-agent
  type: NodePort
  ports:
    - name: gateway
      port: 8642
      targetPort: 8642
    - name: dashboard
      port: 9119
      targetPort: 9119
      nodePort: 30008
    - name: web       # http://homelab-1:30009
      port: 3000
      targetPort: 3000
      nodePort: 30009
