apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-agent-data
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: hermes-agent-pv
  resources:
    requests:
      storage: 256Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: ai
spec:
  replicas: 1
  # one Hermes at a time: two would share the data folder and the Discord bot
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      # Hermes has no business talking to the Kubernetes API; without this
      # it gets a token that could read the cluster.
      automountServiceAccountToken: false
      containers:
        - name: hermes-agent
          image: nousresearch/hermes-agent:latest
          # The image's own supervisor runs the gateway (args) and, with
          # HERMES_DASHBOARD=1, the dashboard; overriding `command` skips it.
          args: ["gateway", "run"]
          env:
            - name: HERMES_DASHBOARD
              value: "1"
            # the dashboard requires a login; the password and the session
            # secret (HERMES_DASHBOARD_BASIC_AUTH_PASSWORD, _SECRET) come from .env
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              value: abhishek
          # one env var per line of .env (`mise run deploy`)
          envFrom:
            - secretRef:
                name: homelab-env
          ports:
            - containerPort: 8642  # gateway / OpenAI-compatible API
            - containerPort: 9119  # web dashboard
            - containerPort: 3000  # workspace UI
          volumeMounts:
            - name: data
              mountPath: /opt/data   # where the image keeps all Hermes state
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: ai
spec:
  selector:
    app: hermes-agent
  type: NodePort
  ports:
    - name: gateway
      port: 8642
      targetPort: 8642
    - name: dashboard
      port: 9119
      targetPort: 9119
      nodePort: 30008
    - name: workspace
      port: 3000
      targetPort: 3000
