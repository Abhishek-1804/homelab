apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All manifests to apply. Kustomize sorts these so Namespaces come first.
resources:
  - namespaces.yaml
  - volumes.yaml
  - ai/hermes-agent.yaml
  - monitoring/gatus.yaml
  - monitoring/dozzle.yaml
  - monitoring/homepage.yaml
  - monitoring/beszel.yaml
  - public/cloudflared.yaml

# Single source of truth for image versions. `name` matches the image in the
# manifest; `newTag` overrides its version everywhere. Bump versions here only.
images:
  - name: henrygd/beszel
    newTag: "0.21.1"
  - name: henrygd/beszel-agent
    newTag: "0.21.1"
  - name: cloudflare/cloudflared
    newTag: "2026.10.3"
  - name: ghcr.io/amir20/dozzle
    newTag: latest
  - name: ghcr.io/gethomepage/homepage
    newTag: latest
  - name: ghcr.io/twin/gatus
    newTag: latest
  - name: nousresearch/hermes-agent
    newTag: v0.22.5   # pinned: bump deliberately (see the release notes)
