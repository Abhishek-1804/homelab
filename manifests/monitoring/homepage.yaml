apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: monitoring
data:
  settings.yaml: |
    title: Homelab
    theme: dark
    color: slate
    headerStyle: clean

  services.yaml: |
    - Monitoring:
        - Gatus:
            href: http://homelab-1.tail53266a.ts.net:30003
            description: Service health checks
            icon: gatus.png
        - Dozzle:
            href: http://homelab-1.tail53266a.ts.net:30016
            description: Live container logs
            icon: dozzle.png
        - Beszel:
            href: http://homelab-1.tail53266a.ts.net:30020
            description: Server stats and temperatures
            icon: beszel.png
    - AI:
        - Hermes Agent:
            href: http://homelab-1.tail53266a.ts.net:30008
            description: Autonomous AI agent
            icon: https://avatars.githubusercontent.com/u/103061224
        - Hermes Web Server:
            href: http://homelab-1.tail53266a.ts.net:30009
            description: Pages Hermes serves, e.g. X-manager
            icon: mdi-web

  widgets.yaml: |
    - search:
        provider: duckduckgo
        target: _blank

  bookmarks.yaml: |
    []

  kubernetes.yaml: |
    mode: disabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          ports:
            - containerPort: 3000
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
          volumeMounts:
            - name: config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - name: config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
            - name: config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
      volumes:
        - name: config
          configMap:
            name: homepage-config
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: monitoring
spec:
  selector:
    app: homepage
  type: NodePort
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30000
