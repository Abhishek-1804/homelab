# Static PersistentVolumes with fixed hostPaths under /srv/homelab on the server.
# Using static PVs means the same directory is reused on every rebuild: data
# survives the cluster being deleted and recreated.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gatus-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /srv/homelab/gatus
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hermes-agent-pv
spec:
  capacity:
    storage: 256Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /srv/homelab/hermes-agent
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: beszel-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /srv/homelab/beszel
    type: DirectoryOrCreate
