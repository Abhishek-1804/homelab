# The laptop side of the homelab: tools and the tasks you run here
# (`mise tasks`). The server gets only server/, applied there by
# `mise run bootstrap`.

[tools]
k9s       = "latest"
kind      = "latest"
kubectl   = "1.36.5"   # pinned: within one minor version of k3s_version in server/mise.toml
terraform = "latest"

[vars]
control_plane = "homelab-1"      # the server with the Kubernetes API (its Tailscale name)
user          = "akdp-latitude"  # its login user
tailscale_key = "tailscale_server_key"   # the tf/infra output it joins with
kubeconfig    = ".kube/kubeconfig-server"

[env]
# one file per cluster: the server's (`mise run kubeconfig`) and kind's (`mise run kind-deploy`)
KUBECONFIG = "{{config_root}}/{{vars.kubeconfig}}:{{config_root}}/.kube/kubeconfig-kind-local"
AWS_PROFILE = "homelab"   # set up by `aws login`

# --- tasks -------------------------------------------------------------------

[tasks.bootstrap]
description = "Set up the server from server/: a new one over its LAN IP, or update it over Tailscale"
usage = '''
arg "[ip]" help="a new server's LAN IP (or the EC2 test server's public IP); omit to update the server over Tailscale"
'''
shell = "bash -euo pipefail -c"
run = '''
remote() {
    mise bootstrap remote --yes --update --source server --host "$@" \
        --bootstrap-command "curl -fsSL https://mise.run | sh"   # faster than uploading mise
}
if [ -n "${usage_ip:-}" ]; then
    name={{vars.control_plane}}; target={{vars.user}}@$usage_ip
    # a fresh install only takes passwords: copy your key once (server/mise.toml
    # turns password logins off at the end of this run)
    SSH_AUTH_SOCK=~/.1password/agent.sock ssh-copy-id "$target"
    # the rest runs sudo without a terminal: allow it without a password (asks for it once)
    ssh -t "$target" "sudo -n true 2>/dev/null || echo '${target%@*} ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/90-homelab >/dev/null"
    ssh "$target" sudo hostnamectl set-hostname "$name"
    # Tailscale join key from tf/infra; server/mise.toml uses it before the firewall
    terraform -chdir=tf/infra output -raw {{vars.tailscale_key}} | ssh "$target" 'umask 077; cat > ~/.tskey'
    # the name now means this machine: replace any old host key saved for it
    ssh-keygen -R "$name" >/dev/null 2>&1 || true
    ssh "$target" cat /etc/ssh/ssh_host_ed25519_key.pub | awk -v h="$name" '{print h, $1, $2}' >> ~/.ssh/known_hosts
    # over the LAN, everything but the firewall (mise won't firewall off its own session)
    remote "$target" --skip firewall
fi

# over Tailscale, everything: the firewall then leaves only Tailscale in
remote {{vars.user}}@{{vars.control_plane}}
'''

[tasks.kubeconfig]
description = "Fetch the server's kubeconfig (.kube/kubeconfig-server) so kubectl and k9s here can reach it"
shell = "bash -euo pipefail -c"
run = '''
mkdir -p .kube
ssh {{vars.user}}@{{vars.control_plane}} sudo cat /etc/rancher/k3s/k3s.yaml \
    | sed "s/127.0.0.1/$(tailscale ip -4 {{vars.control_plane}})/" > {{vars.kubeconfig}}
chmod 600 {{vars.kubeconfig}}
KUBECONFIG={{vars.kubeconfig}} kubectl config rename-context default {{vars.control_plane}} >/dev/null
'''

[tasks.k9s]
description = "Open k9s on the server's cluster"
depends = ["kubeconfig"]
raw = true   # k9s is full-screen
run = "k9s --context {{vars.control_plane}}"

[tasks.tf]
description = "Run terraform in tf/<stack>, e.g. `mise run tf infra plan` (sign in first with `aws login`)"
usage = '''
arg "<stack>" help="state: the S3 bucket for state; infra: budget and Tailscale; test: EC2 test server" {
  choices "state" "infra" "test"
}
arg "<command>" help="init, plan, apply, destroy, output, ..."
arg "[args]" var=#true help="passed on to terraform"
'''
shell = "bash -euo pipefail -c"
run = '''
# tf/infra needs the Tailscale OAuth client from .env, and nothing else from it
if [ "$usage_stack" = infra ]; then set -a; . <(grep '^TAILSCALE_' .env); set +a; fi
# usage passes [args] shell-quoted, so eval splits them back into words
eval "terraform -chdir=tf/$usage_stack $usage_command ${usage_args:-}"
'''

# --- secrets and apps (.env, manifests/) ---

[tasks.generate-env-local]
description = "Write .env.local: the variable names in .env, never values"
run = '''
{ echo "# Generated by \`mise run generate-env-local\` from .env: the secrets that exist, without values."
  awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/ { print $1 "=" }' .env
} > .env.local
'''

[tasks.apply]
description = "Load .env into the homelab-env Secret and apply every manifest, in <context>"
hide = true   # run through deploy or kind-deploy
usage = 'arg "<context>" help="homelab-1 (the server) or kind-homelab (local)"'
shell = "bash -euo pipefail -c"
run = '''
k() { kubectl --context "$usage_context" "$@"; }
k apply -f manifests/namespaces.yaml
# .env is mounted by 1Password; TAILSCALE_* is Terraform's, so it stays out
k -n ai create secret generic homelab-env --from-env-file=<(grep -v '^TAILSCALE_' .env) \
    --dry-run=client -o yaml | k apply -f -
k apply -k manifests/
k -n ai rollout restart deploy/hermes-agent   # picks up changed secrets
'''

[tasks.deploy]
description = "Load .env into the homelab-env Secret and apply every manifest, on the server"
depends = ["kubeconfig"]
run = "mise run apply {{vars.control_plane}}"

[tasks.kind-deploy]
description = "The same, on a local kind cluster (created if needed); apps on http://localhost:<nodePort>"
shell = "bash -euo pipefail -c"
run = '''
kind get clusters 2>/dev/null | grep -qx homelab \
    || kind create cluster --config kind-config.yaml --kubeconfig .kube/kubeconfig-kind-local
mise run apply kind-homelab
'''

[tasks.kind-down]
description = "Delete the local kind cluster"
run = "kind delete cluster --name homelab --kubeconfig .kube/kubeconfig-kind-local"
