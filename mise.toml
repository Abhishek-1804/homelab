# The laptop side of the homelab: tools, the server inventory and the tasks you
# run here (`mise tasks`). Servers get only server/, applied there by
# `mise bootstrap remote`.

[tools]
k9s       = "latest"
kind      = "latest"
kubectl   = "1.36.5"   # pinned: within one minor version of k3s_version in server/mise.toml
terraform = "latest"

[vars]
control_plane = "homelab-1"   # the server with the Kubernetes API

[env]
# two contexts: homelab-1 (`mise run kubeconfig`) and kind-homelab (`mise run kind-deploy`)
KUBECONFIG = "{{config_root}}/.kube/server:{{config_root}}/.kube/kind"
AWS_PROFILE = "homelab"   # set up by `aws login`

# --- servers: one block each; `host` is its Tailscale name -------------------

[bootstrap.remote]
source = "server"   # only this folder is sent; secrets and tf state stay here

[bootstrap.remote.hosts.homelab-1]
host              = "homelab-1"
tags              = ["control-plane"]
bootstrap_command = "curl -fsSL https://mise.run | sh"   # faster than uploading mise

# nodes: one block each with tags = ["node"], e.g. for the 3 EC2 test servers
# [bootstrap.remote.hosts.homelab-2]
# host              = "homelab-2"
# tags              = ["node"]
# bootstrap_command = "curl -fsSL https://mise.run | sh"

# --- tasks -------------------------------------------------------------------

[tasks.bootstrap]
description = "Set up servers from server/: new ones over their LAN IP, or every server over Tailscale"
usage = '''
arg "[new]" var=#true help="new servers as <name>=<user@lan-ip>, control plane first; omit to update every server"
flag "--test" help="EC2 test servers: join Tailscale as ephemeral, so they disappear once offline"
'''
shell = "bash -euo pipefail -c"
run = '''
# a server's role is its inventory tag; server/mise.<role>.toml is loaded on top of server/mise.toml
role() { mise config get "bootstrap.remote.hosts.$1.tags" 2>/dev/null | grep -oE 'control-plane|node' | head -1; }

if [ -z "${usage_new:-}" ]; then
    mise bootstrap remote --tag control-plane --remote-env control-plane --update --yes
    if mise config get bootstrap.remote.hosts | grep -q '"node"'; then
        mise bootstrap remote --tag node --remote-env node --update --yes
    fi
    exit
fi

eval "set -- $usage_new"   # usage passes [new] shell-quoted
for new in "$@"; do
    name=${new%%=*}; dest=${new#*=}; r=$(role "$name" || true)
    [ -n "$r" ] || { echo "✗ $name: add it to [bootstrap.remote.hosts] with a control-plane or node tag" >&2; exit 1; }

    ssh -t "$dest" sudo hostnamectl set-hostname "$name"
    # Tailscale join key from tf/infra; server/mise.toml uses it before the firewall
    key=tailscale_server_key
    [ "${usage_test:-false}" = true ] && key=tailscale_test_key
    terraform -chdir=tf/infra output -raw "$key" | ssh "$dest" 'umask 077; cat > ~/.tskey'
    # a node also needs the control plane's join token, read over Tailscale
    if [ "$r" = node ]; then
        ssh {{vars.control_plane}} sudo cat /var/lib/rancher/k3s/server/node-token \
            | ssh "$dest" 'umask 077; cat > ~/.k3s-token'
    fi
    # the name now means this machine: replace any old host key saved for it
    ssh-keygen -R "$name" >/dev/null 2>&1 || true
    ssh "$dest" cat /etc/ssh/ssh_host_ed25519_key.pub | awk -v h="$name" '{print h, $1, $2}' >> ~/.ssh/known_hosts

    # everything else, firewall included: afterwards only Tailscale reaches it
    mise bootstrap remote --yes --update --host "$dest" --source server --remote-env "$r" \
        --bootstrap-command "curl -fsSL https://mise.run | sh"
done
'''

[tasks.kubeconfig]
description = "Fetch the server's kubeconfig (.kube/server) so kubectl and k9s here can reach it"
shell = "bash -euo pipefail -c"
run = '''
mkdir -p .kube
ssh {{vars.control_plane}} sudo cat /etc/rancher/k3s/k3s.yaml \
    | sed "s/127.0.0.1/$(tailscale ip -4 {{vars.control_plane}})/" > .kube/server
chmod 600 .kube/server
KUBECONFIG=.kube/server kubectl config rename-context default {{vars.control_plane}} >/dev/null
'''

[tasks.k9s]
description = "Open k9s on the server's cluster"
depends = ["kubeconfig"]
raw = true   # k9s is full-screen
run = "k9s --context {{vars.control_plane}}"

[tasks.tf]
description = "Run terraform in tf/<stack>, e.g. `mise run tf infra plan` (sign in first with `aws login`)"
usage = '''
arg "<stack>" help="state: the S3 bucket for state; infra: budget and Tailscale; test: EC2 test server" {
  choices "state" "infra" "test"
}
arg "<command>" help="init, plan, apply, destroy, output, ..."
arg "[args]" var=#true help="passed on to terraform"
'''
shell = "bash -euo pipefail -c"
run = '''
# tf/infra needs the Tailscale OAuth client from .env, and nothing else from it
if [ "$usage_stack" = infra ]; then set -a; . <(grep '^TAILSCALE_' .env); set +a; fi
# usage passes [args] shell-quoted, so eval splits them back into words
eval "terraform -chdir=tf/$usage_stack $usage_command ${usage_args:-}"
'''

# --- secrets and apps (.env, manifests/) ---

[tasks.env-local]
description = "Write .env.local: the variable names in .env, never values"
run = '''
{ echo "# Generated by \`mise run env-local\` from .env: the secrets that exist, without values."
  awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/ { print $1 "=" }' .env
} > .env.local
'''

[tasks.apply]
description = "Load .env into the homelab-env Secret and apply every manifest, in <context>"
hide = true   # run through deploy or kind-deploy
usage = 'arg "<context>" help="homelab-1 (the server) or kind-homelab (local)"'
shell = "bash -euo pipefail -c"
run = '''
k() { kubectl --context "$usage_context" "$@"; }
k apply -f manifests/namespaces.yaml
# .env is mounted by 1Password; TAILSCALE_* is Terraform's, so it stays out
k -n ai create secret generic homelab-env --from-env-file=<(grep -v '^TAILSCALE_' .env) \
    --dry-run=client -o yaml | k apply -f -
k apply -k manifests/
k -n ai rollout restart deploy/hermes-agent   # picks up changed secrets
'''

[tasks.deploy]
description = "Load .env into the homelab-env Secret and apply every manifest, on the server"
depends = ["kubeconfig"]
run = "mise run apply {{vars.control_plane}}"

[tasks.kind-deploy]
description = "The same, on a local kind cluster (created if needed); apps on http://localhost:<nodePort>"
shell = "bash -euo pipefail -c"
run = '''
kind get clusters 2>/dev/null | grep -qx homelab \
    || kind create cluster --config kind-config.yaml --kubeconfig .kube/kind
mise run apply kind-homelab
'''

[tasks.kind-down]
description = "Delete the local kind cluster"
run = "kind delete cluster --name homelab --kubeconfig .kube/kind"
