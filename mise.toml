# The laptop side of the homelab: tools, the server inventory, and the tasks
# you run here (`mise tasks` to list). The servers themselves are set up by
# `mise bootstrap remote`, which sends only server/ over SSH and applies
# server/mise.toml there.

[tools]
kubectl   = "1.36.5"   # within one minor version of k3s_version in server/mise.toml
terraform = "1.16.5"   # tf/: throwaway EC2 servers for testing the bootstrap flow

[vars]
server = "homelab-1"

[env]
# kubectl/k9s here talk to the cluster over Tailscale (`mise run kubeconfig`)
KUBECONFIG = "{{config_root}}/.kube/config"
# terraform in tf/ uses this profile (`mise run tf-login`)
AWS_PROFILE = "homelab"

# --- servers ----------------------------------------------------------------
# One block per server; `host` is its Tailscale name. Add a block to add one.

[bootstrap.remote]
source = "server"   # only this folder is sent; secrets and tf state never leave the laptop

[bootstrap.remote.hosts.homelab-1]
host              = "homelab-1"
bootstrap_command = "curl -fsSL https://mise.run | sh"   # the server downloads mise; uploading it is slow

# --- tasks ------------------------------------------------------------------

[tasks.setup]
description = "First-time setup of a fresh server over the LAN (everything except the firewall)"
usage = '''
arg "<name>" help="the server's name in the inventory, e.g. homelab-1"
arg "<destination>" help="[user@]LAN-IP, used only for this first run"
'''
shell = "bash -euo pipefail -c"
run = '''
step() { printf '\n\033[1m[%s] %s\033[0m\n' "$1" "$2"; }
# --host targets ignore the inventory, so name the source and mise install here.
# -q hides mise's internal ssh commands; errors still show.
remote() {
    mise -q bootstrap remote --host "$usage_destination" --source server \
        --bootstrap-command "curl -fsSL https://mise.run | sh" "$@"
}

step 1/4 "Hostname: $usage_name"
ssh -t "$usage_destination" sudo hostnamectl set-hostname "$usage_name"

step 2/4 "Packages: openssh-server, tailscale, ufw, unattended-upgrades"
remote --only packages --update

# together, so a changed SSH config reloads ssh
step 3/4 "Config files and services: SSH keys only, no sleep, k3s config"
remote --only files,services

step 4/4 "Tailscale login and k3s"
remote --only task

# the firewall would close the LAN SSH session this ran over
printf '\nDone. Next: mise run up (over Tailscale; turns on the firewall)\n'
'''

[tasks.up]
description = "Bring every server in line with this repo, over Tailscale (safe to re-run)"
run = "mise bootstrap remote --all --update"   # --update: apt update first

[tasks.ping]
description = "Check every server answers over Tailscale and SSH"
shell = "bash -euo pipefail -c"
run = '''
for host in $(mise config get bootstrap.remote.hosts | yq -p toml '.[].host'); do
    ts=$(tailscale ping -c 1 --timeout 3s "$host" >/dev/null 2>&1 && echo up || echo down)
    ssh=$(ssh -o BatchMode=yes -o ConnectTimeout=5 "$host" true 2>/dev/null && echo up || echo down)
    printf '%-14s tailscale: %-5s ssh: %s\n' "$host" "$ts" "$ssh"
done
'''
tools = { yq = "4.44.2" }

[tasks.kubeconfig]
description = "Fetch the cluster's kubeconfig so kubectl and k9s here can reach it"
shell = "bash -euo pipefail -c"
run = '''
mkdir -p .kube
ssh {{vars.server}} sudo cat /etc/rancher/k3s/k3s.yaml \
    | sed "s/127.0.0.1/$(tailscale ip -4 {{vars.server}})/" > .kube/config
chmod 600 .kube/config
'''

# --- test servers on AWS (tf/) ---

[tasks.tf-login]
description = "Sign in to AWS in the browser as the akdp IAM user (short-lived credentials)"
run = "aws login"

[tasks.tf-init]
description = "Download the Terraform providers tf/ needs"
dir = "{{config_root}}/tf"
run = "terraform init"

[tasks.tf-plan]
description = "Show what tf-apply would change in AWS"
dir = "{{config_root}}/tf"
run = "terraform plan"

[tasks.tf-apply]
description = "Create the EC2 test server (asks for confirmation)"
dir = "{{config_root}}/tf"
run = "terraform apply"

[tasks.tf-destroy]
description = "Destroy every AWS resource tf/ created (asks for confirmation)"
dir = "{{config_root}}/tf"
run = "terraform destroy"

[tasks.env-local]
description = "Regenerate .env.local from the mounted .env: variable names only, never values"
run = '''
{ echo "# Generated by \`mise run env-local\` from .env: the secrets that exist, without values."
  awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/ { print $1 "=" }' .env
} > .env.local
'''

[tasks.deploy]
description = "Load .env into the homelab-env Secret and apply every manifest"
depends = ["kubeconfig"]
shell = "bash -euo pipefail -c"
run = '''
kubectl apply -f manifests/namespaces.yaml
# .env is mounted by the 1Password desktop app (see README)
kubectl -n ai create secret generic homelab-env --from-env-file=.env \
    --dry-run=client -o yaml | kubectl apply -f -
kubectl apply -k manifests/
# env vars are read at container start, so pick up any secret changes
kubectl -n ai rollout restart deploy/hermes-agent
'''

# --- global docker cleanup (affects ALL docker, not just homelab) ---

[tasks.docker-clean-containers]
description = "Stop and remove every container"
run = 'ids=$(docker ps -aq); [ -n "$ids" ] && docker rm -f $ids || echo "no containers"'

[tasks.docker-clean-images]
description = "Remove every image (clears containers first — they hold image references)"
depends = ["docker-clean-containers"]
run = 'ids=$(docker images -aq); [ -n "$ids" ] && docker rmi -f $ids || echo "no images"'

[tasks.docker-clean-volumes]
description = "Remove every volume (clears containers first — running ones hold volumes)"
depends = ["docker-clean-containers"]
run = 'ids=$(docker volume ls -q); [ -n "$ids" ] && docker volume rm -f $ids || echo "no volumes"'

[tasks.docker-clean-networks]
description = "Remove every user-defined network (clears containers first; built-ins kept)"
depends = ["docker-clean-containers"]
run = 'ids=$(docker network ls --filter type=custom -q); [ -n "$ids" ] && docker network rm $ids || echo "no networks"'

[tasks.docker-nuke]
description = "Wipe ALL docker state: containers, images, volumes, networks"
depends = ["docker-clean-images", "docker-clean-volumes", "docker-clean-networks"]
