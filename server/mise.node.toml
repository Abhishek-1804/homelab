# A node: a k3s agent that joins the control plane. Loaded on top of mise.toml
# with `--remote-env node` (`mise run bootstrap` does it).

[vars]
control_plane = "homelab-1"   # its Tailscale name

[bootstrap.directories."/etc/rancher/k3s"]

[bootstrap.files."/etc/rancher/k3s/config.yaml"]
content = """
# Each key is a `k3s agent` flag: https://docs.k3s.io/cli/agent
server: https://{{vars.control_plane}}:6443
token-file: /etc/rancher/k3s/token
kube-proxy-arg:
  - nodeport-addresses=100.64.0.0/10   # NodePorts answer only on the Tailscale address
"""

# the agent uses the Tailscale address, so start it after Tailscale
[bootstrap.directories."/etc/systemd/system/k3s-agent.service.d"]

[bootstrap.files."/etc/systemd/system/k3s-agent.service.d/after-tailscale.conf"]
content = """
[Unit]
Wants=tailscaled.service
After=tailscaled.service
"""

# `mise bootstrap` runs this last; the installer is safe to re-run (it restarts the agent)
[tasks.bootstrap]
shell = "bash -euo pipefail -c"
run = '''
# the join token, dropped in ~/.k3s-token by `mise run bootstrap`
if [ -f ~/.k3s-token ]; then sudo install -m 600 ~/.k3s-token /etc/rancher/k3s/token; rm ~/.k3s-token; fi
curl -sfL https://get.k3s.io \
    | sudo INSTALL_K3S_VERSION="{{vars.k3s_version}}" sh -s - agent --node-ip "$(tailscale ip -4)"
'''
