# Everything on a server. This folder is all that gets sent to it: applied by
# `mise run setup` the first time and `mise run up` after that; re-running
# only changes what differs.

[vars]
k3s_version = "v1.36.5+k3s1"   # keep kubectl in ../mise.toml within one minor version

# --- packages (Ubuntu Server) ----------------------------------------------

# Tailscale isn't in Ubuntu's repos; this adds Tailscale's own. The suite
# (noble, resolute, ...) follows the server's release automatically.
[bootstrap.apt.sources.tailscale]
uris        = "https://pkgs.tailscale.com/stable/ubuntu"
key         = "https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg"
fingerprint = "2596 A99E AAB3 3821 893C 0A79 458C A832 957F 5868"

[bootstrap.packages]
"apt:openssh-server"      = "latest"
"apt:tailscale"           = "latest"
"apt:ufw"                 = "latest"
"apt:unattended-upgrades" = "latest"   # automatic security updates

[bootstrap.services.ssh]
on_change = "reload"

[bootstrap.services.tailscaled]

[bootstrap.services.ufw]

# --- SSH: keys only ---------------------------------------------------------

[bootstrap.files."/etc/ssh/sshd_config.d/90-homelab.conf"]
notify  = ["ssh"]
content = """
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
"""

# --- firewall: nothing gets in except over Tailscale ------------------------
# `exclusive` removes any ufw rule not listed here, so the list is the whole truth.

[bootstrap.linux.firewall]
backend          = "ufw"
exclusive        = true
default_incoming = "deny"
default_outgoing = "allow"

[[bootstrap.linux.firewall.rules]]
name     = "ssh-tailnet"
port     = 22
protocol = "tcp"
source   = "100.64.0.0/10"   # Tailscale addresses

[[bootstrap.linux.firewall.rules]]
name      = "tailnet"         # the k3s API and NodePorts
interface = "tailscale0"

[[bootstrap.linux.firewall.rules]]
name   = "k3s-pods"
source = "10.42.0.0/16"

[[bootstrap.linux.firewall.rules]]
name   = "k3s-services"
source = "10.43.0.0/16"

# --- stay awake: it's a laptop acting as a server ---------------------------

[bootstrap.directories."/etc/systemd/logind.conf.d"]

[bootstrap.files."/etc/systemd/logind.conf.d/90-homelab.conf"]
content = """
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
"""

[bootstrap.directories."/etc/systemd/sleep.conf.d"]

[bootstrap.files."/etc/systemd/sleep.conf.d/90-homelab.conf"]
content = """
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
"""

# --- k3s --------------------------------------------------------------------

[bootstrap.directories."/etc/rancher/k3s"]

[bootstrap.files."/etc/rancher/k3s/config.yaml"]
content = """
# Each key is a `k3s server` flag: https://docs.k3s.io/cli/server
secrets-encryption: true
disable:
  - traefik            # services are reached by NodePort; no ingress needed yet
kube-proxy-arg:
  - nodeport-addresses=100.64.0.0/10   # NodePorts answer only on the Tailscale address
"""

# NodePorts bind to the Tailscale address, so start k3s after Tailscale
[bootstrap.directories."/etc/systemd/system/k3s.service.d"]

[bootstrap.files."/etc/systemd/system/k3s.service.d/after-tailscale.conf"]
content = """
[Unit]
Wants=tailscaled.service
After=tailscaled.service
"""

# `mise bootstrap` runs this last
[tasks.bootstrap]
description = "Log in to Tailscale (first run only), then install or upgrade k3s"
shell = "bash -euo pipefail -c"
run = '''
if tailscale status >/dev/null 2>&1; then
    echo "✓ Tailscale: already logged in"
else
    echo "→ Tailscale: open the URL below on any device to add this server"
    sudo tailscale up
fi
echo "✓ Tailscale: $(hostname) is $(tailscale ip -4)"

# apply the lid-switch setting now, not at next boot
sudo systemctl reload systemd-logind
echo "✓ Closing the lid no longer sleeps"

installed=$(k3s --version 2>/dev/null | awk 'NR==1 {print $3}' || true)
if [ "$installed" = "{{vars.k3s_version}}" ]; then
    echo "✓ k3s: already {{vars.k3s_version}}"
else
    echo "→ k3s: installing {{vars.k3s_version}} (was: ${installed:-none})"
    curl -sfL https://get.k3s.io \
        | sudo INSTALL_K3S_VERSION="{{vars.k3s_version}}" sh -s - --node-ip "$(tailscale ip -4)"
    echo "✓ k3s: {{vars.k3s_version}} running"
fi
'''
