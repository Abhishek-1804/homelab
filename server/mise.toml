# What every server shares, whatever its role. This folder is all that gets
# sent to it, applied by `mise run bootstrap`; re-running only changes what
# differs. Each role adds its own file on top: mise.control-plane.toml (the
# k3s server), later mise.node.toml (k3s agents).

[vars]
k3s_version = "v1.36.5+k3s1"   # keep kubectl in ../mise.toml within one minor version

# --- packages (Ubuntu Server) ----------------------------------------------

# Tailscale isn't in Ubuntu's repos; this adds Tailscale's own. The suite
# (noble, resolute, ...) follows the server's release automatically.
[bootstrap.apt.sources.tailscale]
uris        = "https://pkgs.tailscale.com/stable/ubuntu"
key         = "https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg"
fingerprint = "2596 A99E AAB3 3821 893C 0A79 458C A832 957F 5868"

[bootstrap.packages]
"apt:openssh-server"      = "latest"
"apt:tailscale"           = "latest"
"apt:ufw"                 = "latest"
"apt:unattended-upgrades" = "latest"   # automatic security updates

# Join Tailscale right after the packages, before the firewall turns on: a first
# run over the LAN would otherwise lock itself out. A failure here stops the run.
# The join key is dropped in ~/.tskey by `mise run bootstrap`.
[bootstrap.hooks]
post-packages = '''
tailscale status >/dev/null 2>&1 && exit 0
[ -f ~/.tskey ] || { echo "✗ not on Tailscale and no ~/.tskey: use mise run bootstrap <name>=<user@lan-ip>" >&2; exit 1; }
sudo systemctl enable --now tailscaled
sudo tailscale up --auth-key="file:$HOME/.tskey"; s=$?; rm -f ~/.tskey; exit $s
'''

[bootstrap.services.ssh]
on_change = "reload"

[bootstrap.services.tailscaled]

[bootstrap.services.ufw]

[bootstrap.services.systemd-logind]
on_change = "reload"   # the lid setting takes effect now, not at next boot

# --- SSH: keys only ---------------------------------------------------------

[bootstrap.files."/etc/ssh/sshd_config.d/90-homelab.conf"]
notify  = ["ssh"]
content = """
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
"""

# --- firewall: nothing gets in except over Tailscale (and Tailscale itself) --
# `exclusive` removes any ufw rule not listed here, so the list is the whole truth.

[bootstrap.linux.firewall]
backend          = "ufw"
exclusive        = true
default_incoming = "deny"
default_outgoing = "allow"

[[bootstrap.linux.firewall.rules]]
name     = "ssh-tailnet"
port     = 22
protocol = "tcp"
source   = "100.64.0.0/10"   # Tailscale addresses

[[bootstrap.linux.firewall.rules]]
name     = "tailscale-direct"   # Tailscale's own port: direct connections instead of relays
port     = 41641
protocol = "udp"

[[bootstrap.linux.firewall.rules]]
name      = "tailnet"         # the k3s API and NodePorts
interface = "tailscale0"

[[bootstrap.linux.firewall.rules]]
name   = "k3s-pods"
source = "10.42.0.0/16"

[[bootstrap.linux.firewall.rules]]
name   = "k3s-services"
source = "10.43.0.0/16"

# --- stay awake: it's a laptop acting as a server ---------------------------

[bootstrap.directories."/etc/systemd/logind.conf.d"]

[bootstrap.files."/etc/systemd/logind.conf.d/90-homelab.conf"]
notify  = ["systemd-logind"]
content = """
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
"""

[bootstrap.directories."/etc/systemd/sleep.conf.d"]

[bootstrap.files."/etc/systemd/sleep.conf.d/90-homelab.conf"]
content = """
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
"""
